<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票交易看板 - 主线题材 · 波段套利 · 个股分析</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="header">
    <h1>交易数据看板</h1>
    <div class="header-right">
      <span class="update-time" id="updateTime">等待数据...</span>
      <button class="btn btn-primary" onclick="refreshData()">刷新数据</button>
      <button class="btn btn-secondary" onclick="showWatchlist()">观察池</button>
    </div>
  </header>

  <div class="indices-bar" id="indicesBar">
    <div class="index-card skeleton">加载中...</div>
  </div>

  <div class="dashboard">
    <div class="col-left">
      <section class="card">
        <h2>主线题材排名</h2>
        <div class="card-body" id="mainThemes">
          <div class="skeleton">加载中...</div>
        </div>
      </section>

      <section class="card">
        <h2>波段套利观察池</h2>
        <div class="card-body" id="bandTargets">
          <div class="skeleton">加载中...</div>
        </div>
      </section>
    </div>

    <div class="col-right">
      <section class="card">
        <h2>市场共识方向</h2>
        <div class="card-body" id="consensus">
          <div class="skeleton">加载中...</div>
        </div>
      </section>

      <section class="card">
        <h2>明日操作建议</h2>
        <div class="card-body" id="advice">
          <div class="skeleton">加载中...</div>
        </div>
      </section>

      <section class="card card-danger">
        <h2>风险提示</h2>
        <div class="card-body" id="riskWarnings">
          <div class="skeleton">加载中...</div>
        </div>
      </section>
    </div>
  </div>

  <!-- 个股深度分析 -->
  <section class="card card-stock-search" style="margin-top:12px">
    <div class="card-header-bar">
      <h2>个股深度分析</h2>
      <div class="stock-search-row">
        <input type="text" id="stockCodeInput" class="stock-code-input" placeholder="输入6位代码, 如 300750" maxlength="6" onkeydown="if(event.key==='Enter')analyzeSingleStock()">
        <button class="btn btn-primary btn-sm" onclick="analyzeSingleStock()">分析</button>
      </div>
    </div>
    <div class="card-body" id="singleStockResult" style="display:none">
    </div>
    <div class="card-body" id="singleStockPlaceholder">
      <div class="skeleton" style="text-align:center;padding:24px;color:#999">输入股票代码, 一键分析技术面、趋势和买卖建议</div>
    </div>
  </section>

  <!-- 观察池个股分析 -->
  <section class="card card-stock-analysis" style="margin-top:12px">
    <div class="card-header-bar">
      <h2>观察池个股深度分析</h2>
      <button class="btn btn-primary btn-sm" onclick="loadStockAnalysis()">刷新个股分析</button>
    </div>
    <div class="stock-summary" id="stockSummary" style="display:none">
      <div class="summary-text" id="summaryText"></div>
      <div class="summary-cards" id="summaryCards"></div>
      <div class="top-picks" id="topPicks"></div>
    </div>
    <div class="card-body" id="stockAnalysisBody">
      <div class="skeleton">点击"刷新个股分析"加载</div>
    </div>
  </section>
</div>

<div class="modal" id="watchlistModal" style="display:none">
  <div class="modal-content">
    <div class="modal-header">
      <h3>观察池管理</h3>
      <button class="btn-close" onclick="closeWatchlist()">X</button>
    </div>
    <div class="modal-body" id="watchlistBody">
      <div class="skeleton">加载中...</div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="watchlistOverlay" style="display:none" onclick="closeWatchlist()"></div>

<script src="app.js"></script>
</body>
</html>
